# Generic binary crack semantic segmentation dataset for SGFADet.
# Expected directory structure:
# dataset_root/
#   images/train/*.jpg|png
#   images/val/*.jpg|png
#   images/test/*.jpg|png       # optional but recommended
#   masks/train/*.png           # same file stem as image; 0=background, 1=crack, 255=ignore
#   masks/val/*.png
#   masks/test/*.png

path: /path/to/your/crack_dataset
train: images/train
val: images/val
test: images/test
masks_dir: masks
nc: 1
names:
  0: crack
